<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffd5" />
      <stop offset="100%" stop-color="#4a90e2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="250" fill="#121212" />
  
  <!-- Subtle Grid Pattern for IDE Feel -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e1e1e" stroke-width="1" />
  </pattern>
  <rect width="800" height="250" fill="url(#grid)" />

  <!-- Glowing Book Logo (Left Aligned) -->
  <g transform="translate(80, 50) scale(1.5)">
    <path d="M 22 65 L 50 75 L 50 35 L 22 25 Z" fill="none" stroke="#4a90e2" stroke-width="2" opacity="0.6" />
    <path d="M 50 75 L 78 65 L 78 25 L 50 35 Z" fill="none" stroke="#4a90e2" stroke-width="2" opacity="0.6" />
    <path d="M 34 60 L 50 66 L 50 42 L 34 36 Z" fill="#00ffd5" opacity="0.05" />
    <path d="M 34 60 L 50 66 L 50 42 L 34 36 Z" fill="none" stroke="#00ffd5" stroke-width="1.5" filter="url(#neonGlow)" />
    <path d="M 50 66 L 66 60 L 66 36 L 50 42 Z" fill="#00ffd5" opacity="0.15" />
    <path d="M 50 66 L 66 60 L 66 36 L 50 42 Z" fill="none" stroke="#00ffd5" stroke-width="1.5" filter="url(#neonGlow)" />
    <circle cx="50" cy="54" r="2" fill="#ffffff" filter="url(#neonGlow)" />
    <path d="M 50 20 L 50 50" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />
  </g>

  <!-- Typography -->
  <text x="250" y="115" font-family="&#39;Segoe UI&#39;, system-ui, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" letter-spacing="2">
    Book Forge
  </text>
  
  <text x="254" y="160" font-family="&#39;Segoe UI&#39;, system-ui, sans-serif" font-size="18" font-weight="400" fill="#888888" letter-spacing="1">
    A DUAL-ENGINE AI PUBLISHING ENVIRONMENT
  </text>

  <!-- Tech Stack Accent Line -->
  <line x1="254" y1="185" x2="354" y2="185" stroke="#00ffd5" stroke-width="2" filter="url(#neonGlow)" />
  <text x="370" y="190" font-family="monospace" font-size="12" fill="#4a90e2" letter-spacing="1">
    REACT • FASTAPI • OLLAMA • MONGODB • PYMUPDF
  </text>
</svg>